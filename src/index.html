<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hacklab desktop buddy</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/htmx.min.js"></script>
  </head>
  <body>
    <main class="card">
      <header class="page-header">
        <img
          class="logo"
          src="https://hacklaboriente.org/img/logosimbolo-light-background.svg"
          alt="Hacklab Oriente logo"
        />
        <h1>Hacklab desktop buddy</h1>
      </header>
      <p class="chip-info" id="chip-info" hx-get="/api/chipinfo" hx-trigger="load" hx-swap="innerHTML">&hellip;</p>

      <div class="grid">
        <div class="stat">
          <h2>Uptime</h2>
          <div class="value" id="uptime" hx-get="/api/uptime" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <button hx-get="/api/uptime" hx-target="#uptime" hx-swap="innerHTML">Refresh</button>
        </div>

        <div class="stat">
          <h2>Free heap</h2>
          <div class="value" id="heap" hx-get="/api/heap" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <button hx-get="/api/heap" hx-target="#heap" hx-swap="innerHTML">Refresh</button>
        </div>

        <div class="stat">
          <h2>WiFi signal</h2>
          <div class="value" id="wifi" hx-get="/api/wifi" hx-trigger="load, every 2s" hx-swap="innerHTML">&hellip;</div>
        </div>

        <div class="stat">
          <h2>FreeRTOS tasks</h2>
          <div class="value" id="tasks" hx-get="/api/tasks" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <button hx-get="/api/tasks" hx-target="#tasks" hx-swap="innerHTML">Refresh</button>
        </div>

        <div class="stat">
          <h2>Blink LED</h2>
          <div class="value" id="blink-result">&hellip;</div>
          <input type="number" id="blink-count" name="count" min="1" max="10" value="3" />
          <button hx-get="/api/blink" hx-include="#blink-count" hx-target="#blink-result" hx-swap="innerHTML">
            Blink
          </button>
        </div>

        <div class="stat">
          <h2>Dice roll</h2>
          <div class="value" id="dice" hx-get="/api/dice" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <button hx-get="/api/dice" hx-target="#dice" hx-swap="innerHTML">Roll</button>
        </div>

        <div class="stat">
          <h2>LED brightness</h2>
          <div class="value" id="led-value" hx-get="/api/led" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <input
            type="range"
            id="led-level"
            name="level"
            min="0"
            max="100"
            value="0"
            hx-get="/api/led"
            hx-trigger="input changed delay:200ms"
            hx-include="this"
            hx-target="#led-value"
            hx-swap="innerHTML"
            hx-sync="this:replace"
          />
        </div>

        <div class="stat">
          <h2>Marquee</h2>
          <div class="value" id="marquee-status" hx-get="/api/marquee" hx-trigger="load" hx-swap="innerHTML">&hellip;</div>
          <input type="text" id="marquee-text" name="text" maxlength="63" placeholder="Type a message" value="HACKLAB ORIENTE" />
          <button hx-get="/api/marquee" hx-include="#marquee-text" hx-target="#marquee-status" hx-swap="innerHTML">
            Show
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
